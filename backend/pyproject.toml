[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # line too long (由 formatter 處理)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends 需要)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E402"]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# 變異測試：cd backend && mutmut run（說明見 docs/testing/MUTATION_TESTING.md）
[tool.mutmut]
source_paths = ["app"]
only_mutate = [
    "app/core/security.py",
    "app/services/matching_service.py",
    "app/services/trust_score.py",
    "app/services/trust_score_recovery.py",
    "app/services/login_limiter.py",
    "app/services/email_rate_limiter.py",
    "app/services/verification_code.py",
    "app/services/token_blacklist.py",
    "app/services/content_moderation.py",
]
also_copy = ["pytest.ini", ".env"]
# 平行 worker 各自使用獨立的 PostgreSQL 測試庫與 Redis db（見 tests/mutmut_isolation.py）
pytest_add_cli_args = ["-p", "no:cacheprovider", "-p", "tests.mutmut_isolation"]
# test_rate_limit 的 slowapi storage 在 import 時綁定 Redis db 0，平行執行會互相干擾
pytest_add_cli_args_test_selection = ["tests/", "--ignore=tests/test_rate_limit.py"]
